# Sakamichi archiver — viewer + syncer.
#
#   viewer — serves the archive web UI on :8080 (index built at startup,
#            re-indexed automatically when the syncer lands files)
#   syncer — loops grab-media.py over SYNC_SITES; secrets (tokens + rotating
#            session cookies) live on their own volume at /data/logs
#
# .env.example documents the variables; `cp .env.example .env` to customize.

services:
  viewer:
    build:
      context: ./viewer
      # Dockerfiles live in build/ (repo root); the build context stays the
      # service directory, so each .dockerignore keeps applying as before
      dockerfile: ../build/viewer.Dockerfile
    ports:
      # VIEWER_BIND_IP restricts the unauthenticated port: on a server fronted
      # by a reverse proxy set it to the docker bridge gateway (172.17.0.1) so
      # only the proxy and co-hosted containers (uptime-kuma) can reach it —
      # never the internet. Empty = all interfaces (local dev).
      - "${VIEWER_BIND_IP:-}:${VIEWER_PORT:-8080}:8080"
    volumes:
      # MEDIA_HOST_DIR pins the archive to a host directory (e.g. a NAS pool
      # share) so the files are browsable outside Docker; unset = named volume
      - "${MEDIA_HOST_DIR:-media}:/data/media"
      - secrets:/data/logs    # the upload endpoint (§3.7) writes the fresh cookie here
    environment:
      PORT: 8080
      MEDIA_DIR: /data/media
      LOGS_DIR: /data/logs
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}   # unset = endpoint disabled
    restart: unless-stopped

  syncer:
    build:
      context: ./tools
      dockerfile: ../build/syncer.Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets PUSH_URL reach services on the docker host
    volumes:
      - "${MEDIA_HOST_DIR:-media}:/data/media"
      - secrets:/data/logs
    environment:
      MEDIA_DIR: /data/media
      LOGS_DIR: /data/logs
      SYNC_INTERVAL: ${SYNC_INTERVAL:-6h}
      SYNC_SITES: ${SYNC_SITES:-nogizaka46}
      SYNC_FLAGS: ${SYNC_FLAGS:-}
      NOTIFY_URL: ${NOTIFY_URL:-}   # optional push on failure/recovery (ntfy/SMTP/webhook)
      PUSH_URL: ${PUSH_URL:-}       # optional Uptime Kuma push monitor (heartbeat per sync round)
    restart: unless-stopped

volumes:
  media: {}
  secrets: {}
